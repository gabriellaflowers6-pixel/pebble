<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -25 65 40">
  <!-- Body shadow -->
  <ellipse cx="0" cy="4" rx="14" ry="8" fill="rgba(0,0,0,0.1)" />
  <!-- Abdomen -->
  <ellipse cx="0" cy="-2" rx="14" ry="10" fill="#F5C542" />
  <!-- Stripes -->
  <rect x="-6" y="-10" width="3" height="16" rx="1" fill="#1a1a1a" />
  <rect x="1" y="-11" width="3" height="17" rx="1" fill="#1a1a1a" />
  <rect x="8" y="-9" width="3" height="14" rx="1" fill="#1a1a1a" />
  <!-- Head -->
  <circle cx="16" cy="-2" r="7" fill="#1a1a1a" />
  <!-- Eyes -->
  <circle cx="19" cy="-4" r="2.5" fill="white" />
  <circle cx="19.5" cy="-4.5" r="1" fill="#1a1a1a" />
  <!-- Antennae -->
  <path d="M 20,-8 Q 24,-18 28,-20" stroke="#1a1a1a" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <circle cx="28" cy="-20" r="1.5" fill="#1a1a1a" />
  <path d="M 17,-8 Q 18,-18 14,-20" stroke="#1a1a1a" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <circle cx="14" cy="-20" r="1.5" fill="#1a1a1a" />
  <!-- Wings -->
  <ellipse cx="4" cy="-12" rx="10" ry="7" fill="rgba(255,255,255,0.7)" stroke="rgba(200,180,120,0.4)" stroke-width="0.5" />
  <ellipse cx="-6" cy="-12" rx="9" ry="6" fill="rgba(255,255,255,0.6)" stroke="rgba(200,180,120,0.4)" stroke-width="0.5" />
  <!-- Stinger -->
  <path d="M -14,-2 L -20,-2" stroke="#D4950A" stroke-width="2" stroke-linecap="round" />
</svg>
