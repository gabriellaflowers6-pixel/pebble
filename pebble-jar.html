<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pebble Jar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e8e2d8;
    font-family: sans-serif;
  }
  .jar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  label {
    font-size: 12px;
    letter-spacing: 2px;
    color: rgba(0,0,0,0.3);
    text-transform: uppercase;
  }
  .bg-toggle { display: flex; gap: 10px; }
  .bg-toggle button {
    padding: 6px 14px;
    border: 1px solid rgba(0,0,0,0.15);
    border-radius: 20px;
    background: none;
    cursor: pointer;
    font-size: 11px;
    color: rgba(0,0,0,0.4);
  }
  .bg-toggle button:hover { background: rgba(0,0,0,0.05); }
</style>
</head>
<body>

<div class="jar-wrap">
  <label>Pebble Jar</label>

  <svg
    id="jar"
    width="220"
    height="420"
    viewBox="0 0 220 420"
    xmlns="http://www.w3.org/2000/svg"
  >
    <defs>

      <!-- Glass body: whisper of aqua, almost invisible -->
      <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#7ab8be" stop-opacity="0.20"/>
        <stop offset="5%"   stop-color="#ffffff" stop-opacity="0.75"/>
        <stop offset="13%"  stop-color="#c8e4e7" stop-opacity="0.06"/>
        <stop offset="50%"  stop-color="#d8eef0" stop-opacity="0.03"/>
        <stop offset="87%"  stop-color="#c0dde0" stop-opacity="0.05"/>
        <stop offset="95%"  stop-color="#ffffff" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#6aaeb4" stop-opacity="0.22"/>
      </linearGradient>

      <!-- Glass bottom (thicker = more color) -->
      <linearGradient id="gBase" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#90c8ce" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#3a8890" stop-opacity="0.48"/>
      </linearGradient>

      <!-- Subtle glass edge blur -->
      <filter id="softEdge" x="-20%" y="-10%" width="140%" height="120%">
        <feGaussianBlur stdDeviation="0.7"/>
      </filter>

      <!-- Marble drop shadow blur -->
      <filter id="mShadow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="1.8"/>
      </filter>
