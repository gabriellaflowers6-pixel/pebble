<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pebble Mock 1 — Vintage Letterpress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #1A0E0A; font-family: 'Libre Baskerville', serif; }

  :root {
    --bg:            #FFF5ED;
    --surface:       #FFFAF5;
    --primary:       #8B2332;
    --primary-light: rgba(139,35,50,0.08);
    --accent:        #D4A0A0;
    --accent-light:  rgba(212,160,160,0.15);
    --dark:          #1A1A1A;
    --muted:         #8A7A6A;
    --card-bg:       rgba(255,250,245,0.97);
    --font-display:  'Playfair Display', serif;
    --font-body:     'Libre Baskerville', serif;
    --font-mono:     'DM Mono', monospace;
  }

  /* ── Phone frame ── */
  .phone-frame {
    width: 375px; height: 100vh; max-height: 812px;
    background: var(--bg);
    position: relative; overflow: hidden;
    margin: 0 auto;
    display: flex; flex-direction: column;
  }
  @media (min-width: 500px) {
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .phone-frame {
      height: 812px;
      box-shadow: 0 0 0 8px #1A1A1A, 0 0 0 11px #8B2332, 0 40px 100px rgba(0,0,0,0.6);
    }
  }

  /* ── Swipe ── */
  .swipe-container {
    flex: 1; overflow-y: auto; scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
    position: relative;
  }
  .swipe-container::-webkit-scrollbar { display: none; }
  .swipe-page-wrap { min-height: 100%; scroll-snap-align: start; }
  .swipe-page {
    min-height: 100%;
    display: flex; flex-direction: column;
    padding: 16px 20px 32px;
    position: relative;
  }
  /* Ornamental footer on every page */
  .swipe-page::after {
    content: '— ✦ —';
    position: absolute; bottom: 12px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Libre Baskerville', serif;
    font-size: 9px; color: #8B2332; opacity: 0.28;
    letter-spacing: 4px; white-space: nowrap;
  }

  /* ── Page dots — square ── */
  .page-dots {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 5px; z-index: 10;
  }
  .page-dot {
    width: 4px; height: 4px;
    background: var(--muted); opacity: 0.2;
    transition: all 0.2s ease; cursor: pointer;
  }
  .page-dot.active { opacity: 1; background: #8B2332; height: 14px; }

  /* ── Card — double frame ── */
  .card {
    background: var(--card-bg);
    border: 2px solid #1A1A1A;
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute; inset: 3px;
    border: 1px solid rgba(139,35,50,0.25);
    pointer-events: none; z-index: 0;
  }
  .card > * { position: relative; z-index: 1; }

  /* ── Dots — square ── */
  .dot {
    border: 1.5px solid var(--accent);
    background: transparent; flex-shrink: 0;
  }
  .dot.filled { background: var(--accent); border-color: var(--accent); }
  .dot.today { border: 2px solid #8B2332; }
  .dot.today.filled { background: #8B2332; border-color: #8B2332; }

  /* ── Checkbox — square ── */
  .checkbox {
    border: 2px solid #8B2332;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.12s;
  }
  .checkbox.done { background: #8B2332; }

  /* ── Page title ── */
  .page-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px; font-weight: 900;
    color: #8B2332;
    text-transform: uppercase;
    letter-spacing: 5px;
    position: relative;
    display: inline-block;
    padding-bottom: 8px;
    margin-bottom: 16px;
    line-height: 1.2;
  }
  .page-title::before { content: '✦ '; font-size: 11px; letter-spacing: 0; }
  .page-title::after {
    content: '';
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 4px; background: #8B2332;
  }

  /* ── Section label ── */
  .sec-label {
    font-family: 'Libre Baskerville', serif;
    font-size: 8px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 3px;
  }

  /* ── Progress ── */
  .progress-track {
    height: 5px;
    background: rgba(139,35,50,0.08);
    border: 1px solid rgba(26,26,26,0.12);
  }
  .progress-fill { height: 100%; background: #8B2332; transition: width 0.3s; }

  /* ── Chat bar ── */
  .chat-bar {
    background: var(--bg);
    border-top: 2px solid #1A1A1A;
    flex-shrink: 0;
  }

  /* ── Streak badge — rectangular ── */
  .streak-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px;
    border: 1.5px solid #8B2332;
    background: var(--primary-light);
  }

  /* ── Jar overlay ── */
  .jar-overlay { background: rgba(255,245,237,0.97); }
  .jar-enter { animation: fadeUp 0.25s ease-out; }
  .settings-enter { animation: slideUp 0.2s ease-out; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }

  .tile-btn { cursor: pointer; transition: transform 0.12s; }
  .tile-btn:hover { transform: scale(1.04); }
  .tile-btn:active { transform: scale(0.96); }

  /* ── Header border ── */
  .header { border-bottom: 2px solid #1A1A1A; }

  /* ── Hairline rule ── */
  .rule { height: 1px; background: rgba(139,35,50,0.15); }

  @media (prefers-reduced-motion: reduce) {
    .jar-enter, .settings-enter { animation: none; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useContext, useCallback, useEffect, useRef, createContext, useReducer } = React;

/* ── Date ── */
const today = new Date(2026, 2, 9);
const todayKey = '2026-03-09';

function getStreak(dots, category) {
  const d = dots[category] || {};
  let streak = 0;
  const cur = new Date(today);
  while (true) {
    const key = cur.toISOString().split('T')[0];
    if (!d[key]) break;
    streak++;
    cur.setDate(cur.getDate() - 1);
  }
  return streak;
}

/* ── Data ── */
const DataCtx = createContext();

const initialData = {
  profile: { name: 'Gabby' },
  planner: {
    todos: [
      { id: 1, text: 'record demo video', priority: 'high', done: true },
      { id: 2, text: 'polish landing page', priority: 'high', done: true },
      { id: 3, text: 'submit to skool', priority: 'high', done: false },
      { id: 4, text: 'grocery shopping', priority: 'medium', done: false },
      { id: 5, text: 'review pebble PRD', priority: 'medium', done: false },
      { id: 6, text: 'call dentist', priority: 'low', done: false },
    ],
  },
  kitchen: {
    mealPlan: { breakfast: 'smoothie bowl', lunch: 'buddha bowl', dinner: '' },
    calorieLog: { breakfast: 380, lunch: 520, dinner: 0 },
    target: 1800,
  },
  gym: {
    workoutPlan: [{ name: '30 min yoga flow', exercises: ['sun salutations', 'warrior II flow', 'pigeon pose', 'savasana'] }],
  },
  dots: {
    workout:  { '2026-03-01': true, '2026-03-02': true, '2026-03-03': true, '2026-03-04': true, '2026-03-05': true },
    skincare: { '2026-03-01': true, '2026-03-02': true, '2026-03-03': true, '2026-03-04': true, '2026-03-05': true, '2026-03-06': true, '2026-03-07': true, '2026-03-08': true },
    study:    { '2026-03-01': true, '2026-03-03': true, '2026-03-05': true, '2026-03-07': true },
    meals:    { '2026-03-01': true, '2026-03-02': true, '2026-03-03': true, '2026-03-04': true, '2026-03-06': true },
    water:    { '2026-03-01': true, '2026-03-02': true, '2026-03-03': true, '2026-03-04': true, '2026-03-05': true, '2026-03-06': true },
  },
  notebook: {
    dailyPick: {
      quote: 'The only way to do great work is to love what you do.',
      quoteAuthor: 'Steve Jobs',
      rec: { type: 'film', title: 'Amélie', reason: 'A warm, whimsical film for your creative week.' },
    },
  },
};

let _nextId = 100;
function dataReducer(state, action) {
  switch (action.type) {
    case 'TOGGLE_TODO': {
      const todos = state.planner.todos.map(t => t.id === action.id ? { ...t, done: !t.done } : t);
      return { ...state, planner: { ...state.planner, todos } };
    }
    case 'ADD_TODO': {
      const todo = { id: _nextId++, text: action.text, priority: 'medium', done: false };
      return { ...state, planner: { ...state.planner, todos: [...state.planner.todos, todo] } };
    }
    case 'DELETE_TODO': {
      return { ...state, planner: { ...state.planner, todos: state.planner.todos.filter(t => t.id !== action.id) } };
    }
    case 'TOGGLE_DOT': {
      const cat = { ...(state.dots[action.category] || {}) };
      if (cat[action.date]) delete cat[action.date]; else cat[action.date] = true;
      return { ...state, dots: { ...state.dots, [action.category]: cat } };
    }
    default: return state;
  }
}

function DataProvider({ children }) {
  const [data, dispatch] = useReducer(dataReducer, initialData);
  return React.createElement(DataCtx.Provider, { value: { data, dispatch } }, children);
}

/* ── Icons ── */
const Check = () => <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
const X = () => <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
const Send = () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>;
const Gear = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
const ChevronDown = () => <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg>;

/* ── Ornament rule ── */
function OrnRule({ style }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, ...style }}>
      <div style={{ flex: 1, height: 1, background: 'rgba(139,35,50,0.18)' }} />
      <span style={{ fontFamily: 'var(--font-body)', fontSize: 9, color: '#8B2332', opacity: 0.45 }}>✦</span>
      <div style={{ flex: 1, height: 1, background: 'rgba(139,35,50,0.18)' }} />
    </div>
  );
}

/* ── Section label ── */
function SL({ children, right }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
      <span className="sec-label">{children}</span>
      {right && <span className="sec-label">{right}</span>}
    </div>
  );
}

/* ── Page ornament (top-right) ── */
function PageOrn() {
  return (
    <svg style={{ position: 'absolute', top: 12, right: 18, pointerEvents: 'none', opacity: 0.13 }} width="24" height="30" viewBox="0 0 24 30">
      <path d="M12 1 C12 1, 7 7, 7 12 C7 15, 9 17, 12 17 C15 17, 17 15, 17 12 C17 7, 12 1, 12 1Z" fill="#8B2332"/>
      <line x1="12" y1="17" x2="12" y2="28" stroke="#8B2332" strokeWidth="1.5"/>
      <line x1="8" y1="21" x2="16" y2="21" stroke="#8B2332" strokeWidth="1"/>
      <line x1="9" y1="25" x2="15" y2="25" stroke="#8B2332" strokeWidth="0.75"/>
      <circle cx="12" cy="29" r="1.5" fill="#8B2332"/>
    </svg>
  );
}

/* ══════════════════════════════════════════
   MARBLE JAR (square tiles)
══════════════════════════════════════════ */
const PAGE_LABELS = ['Stream', 'Planner', 'Kitchen', 'Gym', 'Tracker', 'Picks'];

function MarbleJar({ open, onClose, onNavigate, currentPage }) {
  if (!open) return null;
  const tiles = [
    { cx: 88,  cy: 140, label: 'Stream',  page: 0 },
    { cx: 175, cy: 128, label: 'Planner', page: 1 },
    { cx: 130, cy: 188, label: 'Kitchen', page: 2 },
    { cx: 68,  cy: 228, label: 'Gym',     page: 3 },
    { cx: 192, cy: 210, label: 'Tracker', page: 4 },
    { cx: 132, cy: 268, label: 'Picks',   page: 5 },
  ];
  return (
    <div className="absolute inset-0 z-50 jar-overlay flex flex-col items-center justify-center" onClick={onClose}>
      <div className="jar-enter flex flex-col items-center" onClick={e => e.stopPropagation()}>
        <div style={{ textAlign: 'center', marginBottom: 12 }}>
          <p style={{ fontFamily: 'var(--font-body)', fontSize: 8, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: 4, marginBottom: 4 }}>Navigate</p>
          <p style={{ fontFamily: 'var(--font-display)', fontSize: 26, fontWeight: 900, color: '#1A1A1A', textTransform: 'uppercase', letterSpacing: 4, lineHeight: 1 }}>Pebble Jar</p>
          <div style={{ width: 50, height: 4, background: '#8B2332', margin: '8px auto 0' }} />
        </div>
        <svg width="280" height="360" viewBox="0 0 280 360" fill="none">
          {/* Jar outline */}
          <path d="M90 58 C92 50, 102 46, 140 44 C178 46, 188 50, 190 58" stroke="#8B2332" strokeWidth="1.5" fill="none"/>
          <path d="M84 62 C118 58, 162 58, 196 62" stroke="#1A1A1A" strokeWidth="1.5" fill="none"/>
          <path d="M84 62 C76 80, 48 112, 42 152 C36 192, 38 252, 46 290 C54 328, 82 350, 140 352 C198 350, 226 328, 234 290 C242 252, 244 192, 238 152 C232 112, 204 80, 196 62Z" stroke="#1A1A1A" strokeWidth="2" fill="rgba(255,250,245,0.75)"/>
          {/* Inner jar frame */}
          <path d="M92 68 C125 64, 155 64, 188 68" stroke="rgba(139,35,50,0.25)" strokeWidth="0.5" fill="none"/>
          {tiles.map((t, i) => {
            const active = currentPage === t.page;
            return (
              <g key={i} className="tile-btn" onClick={() => { onNavigate(t.page); onClose(); }}>
                <rect x={t.cx - 26} y={t.cy - 22} width={52} height={44}
                  fill={active ? '#8B2332' : 'rgba(255,245,237,0.92)'}
                  stroke={active ? '#8B2332' : '#1A1A1A'}
                  strokeWidth={active ? 2 : 1.5}/>
                <rect x={t.cx - 22} y={t.cy - 18} width={44} height={36}
                  fill="none"
                  stroke={active ? 'rgba(255,245,237,0.25)' : 'rgba(139,35,50,0.2)'}
                  strokeWidth="0.5"/>
                <text x={t.cx} y={t.cy + 1} textAnchor="middle" dominantBaseline="middle"
                  fill={active ? 'white' : '#1A1A1A'}
                  style={{ fontFamily: "'Libre Baskerville', serif", fontSize: t.label.length > 6 ? '7px' : '8px', fontWeight: 700, letterSpacing: '1px', textTransform: 'uppercase' }}>
                  {t.label}
                </text>
              </g>
            );
          })}
          <text x="140" y="345" textAnchor="middle" fill="#8B2332" style={{ fontFamily: "'Libre Baskerville', serif", fontSize: '8px', letterSpacing: '3px', opacity: 0.3 }}>— ✦ —</text>
        </svg>
        <p style={{ fontFamily: 'var(--font-body)', fontSize: 8, color: 'var(--muted)', marginTop: 4, opacity: 0.45, cursor: 'pointer', letterSpacing: 3, textTransform: 'uppercase' }} onClick={onClose}>tap outside to close</p>
      </div>
    </div>
  );
}

/* ── Page dots ── */
function PageDots({ currentPage, totalPages, onDotClick }) {
  return (
    <div className="page-dots">
      {Array.from({ length: totalPages }, (_, i) => (
        <div key={i} className={`page-dot ${i === currentPage ? 'active' : ''}`} onClick={() => onDotClick(i)} role="button" aria-label={`Go to ${PAGE_LABELS[i]}`}/>
      ))}
    </div>
  );
}

/* ── Header ── */
function Header({ onJarOpen, onSettingsOpen }) {
  return (
    <div className="header px-5 flex items-end justify-between flex-shrink-0" style={{ paddingTop: 44, paddingBottom: 10 }}>
      <div>
        <p style={{ fontFamily: 'var(--font-body)', fontSize: 7, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: 4, marginBottom: 3 }}>Your Life</p>
        <h1 style={{ fontFamily: 'var(--font-display)', fontSize: 28, fontWeight: 900, color: '#1A1A1A', textTransform: 'uppercase', letterSpacing: 4, lineHeight: 1 }}>Pebble</h1>
      </div>
      <div style={{ textAlign: 'right', paddingBottom: 2 }}>
        <p style={{ fontFamily: 'var(--font-mono)', fontSize: 9, color: 'var(--muted)', marginBottom: 6, letterSpacing: 1 }}>Mon · Mar 9 · 2026</p>
        <div style={{ display: 'flex', gap: 6, justifyContent: 'flex-end' }}>
          <button onClick={onSettingsOpen}
            style={{ width: 30, height: 30, border: '1.5px solid rgba(26,26,26,0.25)', background: 'transparent', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background 0.12s' }}
            onMouseEnter={e => e.currentTarget.style.background = 'var(--primary-light)'}
            onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
            <Gear/>
          </button>
          <button onClick={onJarOpen}
            style={{ width: 30, height: 30, border: '1.5px solid #8B2332', background: 'transparent', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background 0.12s' }}
            onMouseEnter={e => e.currentTarget.style.background = 'var(--primary-light)'}
            onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
            <span style={{ fontFamily: 'var(--font-body)', fontSize: 13, color: '#8B2332', lineHeight: 1 }}>✦</span>
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── Chat bar ── */
function ChatBar() {
  const [msg, setMsg] = useState('');
  return (
    <div className="chat-bar px-4" style={{ paddingTop: 9, paddingBottom: 9, display: 'flex', alignItems: 'center', gap: 8 }}>
      <input
        type="text" value={msg} onChange={e => setMsg(e.target.value)}
        placeholder="talk to pebble..."
        style={{ flex: 1, background: 'transparent', border: '1.5px solid rgba(26,26,26,0.2)', padding: '7px 12px', fontFamily: 'var(--font-body)', fontSize: 11, color: '#1A1A1A', outline: 'none', transition: 'border-color 0.12s' }}
        onFocus={e => e.target.style.borderColor = '#8B2332'}
        onBlur={e => e.target.style.borderColor = 'rgba(26,26,26,0.2)'}
        onKeyDown={e => { if (e.key === 'Enter') setMsg(''); }}
      />
      <button
        style={{ width: 34, height: 34, background: '#8B2332', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, opacity: msg.trim() ? 1 : 0.35, transition: 'opacity 0.12s' }}
        onClick={() => setMsg('')}>
        <Send/>
      </button>
    </div>
  );
}

/* ══════════════════════════════════════════
   PAGE 0 — STREAM (Home)
══════════════════════════════════════════ */
function StreamPage() {
  const { data, dispatch } = useContext(DataCtx);
  const bestStreak = Math.max(0, ...Object.keys(data.dots).map(k => getStreak(data.dots, k)));
  const categories = ['workout', 'skincare', 'study', 'meals', 'water'];
  const totalCal = Object.values(data.kitchen.calorieLog).reduce((a, b) => a + b, 0);
  const doneCount = data.planner.todos.filter(t => t.done).length;

  return (
    <div className="swipe-page">
      <PageOrn/>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', paddingTop: 8, paddingBottom: 16 }}>

        {/* Greeting block */}
        <div style={{ marginBottom: 20 }}>
          <p style={{ fontFamily: 'var(--font-body)', fontSize: 8, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: 3.5, marginBottom: 6 }}>Monday, March 9th</p>
          <p style={{ fontFamily: 'var(--font-display)', fontSize: 13, color: 'var(--muted)', fontStyle: 'italic', marginBottom: 2 }}>good morning,</p>
          <p style={{ fontFamily: 'var(--font-display)', fontSize: 30, fontWeight: 900, color: '#1A1A1A', lineHeight: 1.1, letterSpacing: 1 }}>{data.profile.name}.</p>
        </div>

        {/* Streak */}
        {bestStreak > 0 && (
          <div className="streak-badge" style={{ marginBottom: 20, alignSelf: 'flex-start' }}>
            <span style={{ fontFamily: 'var(--font-body)', fontSize: 9, color: '#8B2332' }}>✦</span>
            <span style={{ fontFamily: 'var(--font-body)', fontSize: 10, fontWeight: 700, color: '#8B2332' }}>{bestStreak} day streak</span>
          </div>
        )}

        {/* Today's dots */}
        <SL>Today's Dots</SL>
        <div className="card px-4 py-3" style={{ marginBottom: 14 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between' }}>
            {categories.map(cat => {
              const filled = data.dots[cat]?.[todayKey];
              return (
                <div key={cat} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 5 }}>
                  <div className={`dot today ${filled ? 'filled' : ''}`}
                    style={{ width: 14, height: 14, cursor: 'pointer' }}
                    onClick={() => dispatch({ type: 'TOGGLE_DOT', category: cat, date: todayKey })}/>
                  <span style={{ fontFamily: 'var(--font-body)', fontSize: 7, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: 1 }}>{cat.slice(0, 4)}</span>
                </div>
              );
            })}
          </div>
        </div>

        {/* Quick stats */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 24 }}>
          <div className="card px-4 py-3">
            <p style={{ fontFamily: 'var(--font-body)', fontSize: 7, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: 2.5, marginBottom: 8 }}>Tasks</p>
            <p style={{ fontFamily: 'var(--font-display)', fontSize: 30, fontWeight: 900, color: '#1A1A1A', lineHeight: 1 }}>
              {doneCount}<span style={{ fontSize: 14, fontWeight: 400, color: 'var(--muted)' }}>/{data.planner.todos.length}</span>
            </p>
            <p style={{ fontFamily: 'var(--font-body)', fontSize: 8, color: 'var(--muted)', marginTop: 4 }}>completed</p>
          </div>
          <div className="card px-4 py-3">
            <p style={{ fontFamily: 'var(--font-body)', fontSize: 7, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: 2.5, marginBottom: 8 }}>Calories</p>
            <p style={{ fontFamily: 'var(--font-mono)', fontSize: 26, fontWeight: 500, color: '#1A1A1A', lineHeight: 1 }}>{totalCal}</p>
            <p style={{ fontFamily: 'var(--font-body)', fontSize: 8, color: 'var(--muted)', marginTop: 4 }}>of {data.kitchen.target}</p>
          </div>
        </div>

        {/* Swipe hint */}
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, opacity: 0.28 }}>
          <ChevronDown/>
          <span style={{ fontFamily: 'var(--font-body)', fontSize: 7, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: 2.5 }}>scroll</span>
        </div>

      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   PAGE 1 — PLANNER
══════════════════════════════════════════ */
function PlannerPage() {
  const { data, dispatch } = useContext(DataCtx);
  const [newTask, setNewTask] = useState('');
  const [filter, setFilter] = useState('all');
  const todos = data.planner.todos;
  const filtered = filter === 'all' ? todos : filter === 'active' ? todos.filter(t => !t.done) : todos.filter(t => t.done);
  const doneCount = todos.filter(t => t.done).length;

  const addTask = () => {
    if (!newTask.trim()) return;
    dispatch({ type: 'ADD_TODO', text: newTask.trim() });
    setNewTask('');
  };

  return (
    <div className="swipe-page">
      <PageOrn/>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', paddingTop: 8, paddingBottom: 16 }}>

        <p className="page-title">Planner</p>

        {/* Filter */}
        <div style={{ display: 'flex', gap: 6, marginBottom: 12 }}>
          {['all', 'active', 'done'].map(f => (
            <button key={f} onClick={() => setFilter(f)}
              style={{ fontFamily: 'var(--font-body)', fontSize: 8, textTransform: 'uppercase', letterSpacing: 2,
                padding: '4px 10px',
                border: filter === f ? '1.5px solid #8B2332' : '1px solid rgba(26,26,26,0.18)',
                background: filter === f ? 'var(--primary-light)' : 'transparent',
                color: filter === f ? '#8B2332' : 'var(--muted)', cursor: 'pointer' }}>
              {f}
            </button>
          ))}
          <span style={{ fontFamily: 'var(--font-mono)', fontSize: 9, color: 'var(--muted)', marginLeft: 'auto', alignSelf: 'center' }}>{doneCount}/{todos.length}</span>
        </div>

        {/* Task list */}
        <div className="card px-4 py-2" style={{ flex: 1, overflowY: 'auto', maxHeight: 340, marginBottom: 8 }}>
          {filtered.map((task, i) => (
            <div key={task.id} style={{
              display: 'flex', alignItems: 'center', gap: 10,
              paddingTop: 10, paddingBottom: 10,
              borderBottom: i < filtered.length - 1 ? '1px solid rgba(139,35,50,0.1)' : 'none'
            }}>
              <div className={`checkbox ${task.done ? 'done' : ''}`}
                style={{ width: 17, height: 17 }}
                onClick={() => dispatch({ type: 'TOGGLE_TODO', id: task.id })}>
                {task.done && <Check/>}
              </div>
              <span style={{ fontFamily: 'var(--font-body)', fontSize: 12, color: task.done ? 'var(--muted)' : '#1A1A1A', textDecoration: task.done ? 'line-through' : 'none', flex: 1, lineHeight: 1.4 }}>
                {task.text}
              </span>
              {task.priority === 'high'   && !task.done && <div style={{ width: 5, height: 5, background: '#8B2332', flexShrink: 0 }}/>}
              {task.priority === 'medium' && !task.done && <div style={{ width: 5, height: 5, background: 'var(--accent)', flexShrink: 0 }}/>}
              <button onClick={() => dispatch({ type: 'DELETE_TODO', id: task.id })}
                style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 2, opacity: 0.3, flexShrink: 0 }}>
                <X/>
              </button>
            </div>
          ))}
          {filtered.length === 0 && (
            <p style={{ fontFamily: 'var(--font-body)', fontSize: 11, color: 'var(--muted)', textAlign: 'center', padding: 20, fontStyle: 'italic' }}>
              {filter === 'done' ? 'nothing completed yet' : filter === 'active' ? 'all done!' : 'no tasks yet'}
            </p>
          )}
        </div>

        {/* Add task */}
        <div className="card px-3" style={{ display: 'flex', alignItems: 'center', gap: 8, paddingTop: 9, paddingBottom: 9 }}>
          <input type="text" value={newTask} onChange={e => setNewTask(e.target.value)}
            placeholder="add a task..."
            onKeyDown={e => e.key === 'Enter' && addTask()}
            style={{ flex: 1, background: 'transparent', border: 'none', outline: 'none', fontFamily: 'var(--font-body)', fontSize: 12, color: '#1A1A1A' }}/>
          <button onClick={addTask}
            style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#8B2332', fontFamily: 'var(--font-display)', fontSize: 22, lineHeight: 1, opacity: newTask.trim() ? 1 : 0.28 }}>
            +
          </button>
        </div>

      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   PAGE 2 — KITCHEN
══════════════════════════════════════════ */
function KitchenPage() {
  const { data } = useContext(DataCtx);
  const { mealPlan, calorieLog, target } = data.kitchen;
  const totalCal = Object.values(calorieLog).reduce((a, b) => a + b, 0);
  const pct = Math.min(Math.round((totalCal / target) * 100), 100);
  const meals = [
    { key: 'breakfast', name: mealPlan.breakfast, cal: calorieLog.breakfast },
    { key: 'lunch',     name: mealPlan.lunch,      cal: calorieLog.lunch },
    { key: 'dinner',    name: mealPlan.dinner,      cal: calorieLog.dinner },
  ];

  return (
    <div className="swipe-page">
      <PageOrn/>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', paddingTop: 8, paddingBottom: 16 }}>

        <p className="page-title">Kitchen</p>

        {/* Calorie card */}
        <div className="card px-4 py-4" style={{ marginBottom: 16 }}>
          <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', marginBottom: 14 }}>
            <div>
              <p style={{ fontFamily: 'var(--font-body)', fontSize: 7, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: 3, marginBottom: 4 }}>Calories Today</p>
              <p style={{ fontFamily: 'var(--font-mono)', fontSize: 38, fontWeight: 500, color: '#1A1A1A', lineHeight: 1 }}>{totalCal}</p>
              <p style={{ fontFamily: 'var(--font-body)', fontSize: 9, color: 'var(--muted)', marginTop: 3 }}>of {target} target</p>
            </div>
            <p style={{ fontFamily: 'var(--font-display)', fontSize: 26, fontWeight: 900, color: '#8B2332', lineHeight: 1 }}>{pct}%</p>
          </div>
          <div className="progress-track">
            <div className="progress-fill" style={{ width: `${pct}%` }}/>
          </div>
        </div>

        <SL>Meal Plan</SL>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {meals.map(m => (
            <div key={m.key} className="card px-4 py-3" style={{ display: 'flex', alignItems: 'center' }}>
              <div style={{ flex: 1 }}>
                <p style={{ fontFamily: 'var(--font-body)', fontSize: 7, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: 2.5, marginBottom: 4 }}>{m.key}</p>
                <p style={{ fontFamily: 'var(--font-display)', fontSize: 14, color: m.name ? '#1A1A1A' : 'var(--muted)', fontStyle: m.name ? 'normal' : 'italic' }}>
                  {m.name || 'not planned'}
                </p>
              </div>
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 14, fontWeight: 500, color: m.cal > 0 ? '#8B2332' : 'rgba(138,122,106,0.4)' }}>
                {m.cal > 0 ? m.cal : '—'}
              </span>
            </div>
          ))}
        </div>

      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   PAGE 3 — GYM
══════════════════════════════════════════ */
function GymPage() {
  const { data, dispatch } = useContext(DataCtx);
  const plan = data.gym.workoutPlan[0];
  const streak = getStreak(data.dots, 'workout');
  const loggedToday = data.dots.workout?.[todayKey];

  return (
    <div className="swipe-page">
      <PageOrn/>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', paddingTop: 8, paddingBottom: 16 }}>

        <p className="page-title">Gym</p>

        {/* Workout card */}
        <div className="card px-4 py-4" style={{ marginBottom: 16 }}>
          <p style={{ fontFamily: 'var(--font-body)', fontSize: 7, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: 3, marginBottom: 6 }}>Today's Workout</p>
          <p style={{ fontFamily: 'var(--font-display)', fontSize: 18, fontWeight: 700, color: '#1A1A1A', marginBottom: 14 }}>{plan?.name}</p>

          {streak > 0 && (
            <div className="streak-badge" style={{ marginBottom: 14, display: 'inline-flex' }}>
              <span style={{ fontFamily: 'var(--font-body)', fontSize: 9, color: '#8B2332' }}>✦</span>
              <span style={{ fontFamily: 'var(--font-body)', fontSize: 10, fontWeight: 700, color: '#8B2332' }}>{streak} day streak</span>
            </div>
          )}

          {loggedToday ? (
            <p style={{ fontFamily: 'var(--font-body)', fontSize: 11, color: '#8B2332', fontStyle: 'italic' }}>✦ logged today</p>
          ) : (
            <button onClick={() => dispatch({ type: 'TOGGLE_DOT', category: 'workout', date: todayKey })}
              style={{ fontFamily: 'var(--font-body)', fontSize: 9, textTransform: 'uppercase', letterSpacing: 2.5, padding: '7px 18px', background: '#8B2332', color: 'white', border: 'none', cursor: 'pointer' }}>
              Log Today ✦
            </button>
          )}
        </div>

        <SL>Exercises</SL>
        <div className="card px-4 py-2" style={{ flex: 1 }}>
          {(plan?.exercises || []).map((ex, i, arr) => (
            <div key={i} style={{
              display: 'flex', alignItems: 'center', gap: 12,
              paddingTop: 10, paddingBottom: 10,
              borderBottom: i < arr.length - 1 ? '1px solid rgba(139,35,50,0.1)' : 'none'
            }}>
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 9, color: '#8B2332', minWidth: 18 }}>0{i + 1}</span>
              <span style={{ fontFamily: 'var(--font-body)', fontSize: 13, color: '#1A1A1A' }}>{ex}</span>
            </div>
          ))}
        </div>

      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   PAGE 4 — TRACKER
══════════════════════════════════════════ */
function TrackerPage() {
  const { data, dispatch } = useContext(DataCtx);
  const categories = ['workout', 'skincare', 'study', 'meals', 'water'];
  const daysThisMonth = today.getDate(); // only show days up to today

  return (
    <div className="swipe-page">
      <PageOrn/>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', paddingTop: 8, paddingBottom: 16 }}>

        <div style={{ marginBottom: 4 }}>
          <p className="page-title" style={{ marginBottom: 4 }}>Tracker</p>
          <p style={{ fontFamily: 'var(--font-body)', fontSize: 8, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: 3, marginBottom: 14 }}>March 2026</p>
        </div>

        <div className="card" style={{ flex: 1, overflowY: 'auto', maxHeight: 450, padding: 16 }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
            {categories.map(cat => {
              const dots = data.dots[cat] || {};
              const streak = getStreak(data.dots, cat);
              return (
                <div key={cat}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                    <span style={{ fontFamily: 'var(--font-body)', fontSize: 8, color: '#8B2332', textTransform: 'uppercase', letterSpacing: 2.5, fontWeight: 700 }}>{cat}</span>
                    {streak > 0 && <span style={{ fontFamily: 'var(--font-mono)', fontSize: 8, color: 'var(--muted)' }}>{streak}d</span>}
                  </div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
                    {Array.from({ length: daysThisMonth }, (_, i) => {
                      const d = new Date(2026, 2, i + 1);
                      const key = d.toISOString().split('T')[0];
                      const filled = dots[key];
                      const isToday = i + 1 === today.getDate();
                      return (
                        <div key={i}
                          className={`dot ${filled ? 'filled' : ''} ${isToday ? 'today' : ''}`}
                          style={{ width: 11, height: 11, cursor: 'pointer' }}
                          onClick={() => dispatch({ type: 'TOGGLE_DOT', category: cat, date: key })}/>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   PAGE 5 — PICKS
══════════════════════════════════════════ */
function PicksPage() {
  const { data } = useContext(DataCtx);
  const { quote, quoteAuthor, rec } = data.notebook.dailyPick;

  return (
    <div className="swipe-page">
      <PageOrn/>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', paddingTop: 8, paddingBottom: 16 }}>

        <p className="page-title">Picks</p>

        {/* Quote card */}
        <div className="card px-5 py-5" style={{ marginBottom: 20, textAlign: 'center' }}>
          <OrnRule style={{ marginBottom: 16 }}/>
          <p style={{ fontFamily: 'var(--font-display)', fontSize: 15, color: '#1A1A1A', fontStyle: 'italic', lineHeight: 1.75, marginBottom: 14 }}>
            "{quote}"
          </p>
          <p style={{ fontFamily: 'var(--font-body)', fontSize: 9, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: 3 }}>
            — {quoteAuthor}
          </p>
          <OrnRule style={{ marginTop: 16 }}/>
        </div>

        {/* Rec card */}
        <SL>Today's Recommendation</SL>
        <div className="card px-4 py-4" style={{ display: 'flex', alignItems: 'flex-start', gap: 12 }}>
          <div style={{ width: 36, height: 36, border: '1.5px solid #8B2332', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
            <span style={{ fontFamily: 'var(--font-body)', fontSize: 14, color: '#8B2332' }}>✦</span>
          </div>
          <div>
            <p style={{ fontFamily: 'var(--font-body)', fontSize: 7, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: 2.5, marginBottom: 4 }}>{rec?.type}</p>
            <p style={{ fontFamily: 'var(--font-display)', fontSize: 16, fontWeight: 700, color: '#1A1A1A', marginBottom: 5 }}>{rec?.title}</p>
            <p style={{ fontFamily: 'var(--font-body)', fontSize: 11, color: 'var(--muted)', lineHeight: 1.6, fontStyle: 'italic' }}>{rec?.reason}</p>
          </div>
        </div>

      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   SETTINGS (mock)
══════════════════════════════════════════ */
function SettingsPanel({ open, onClose }) {
  if (!open) return null;
  return (
    <div className="absolute inset-0 z-50 settings-enter" style={{ background: 'var(--bg)', display: 'flex', flexDirection: 'column' }}>
      <div style={{ borderBottom: '2px solid #1A1A1A', padding: '44px 20px 12px', display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between' }}>
        <p className="page-title" style={{ margin: 0 }}>Settings</p>
        <button onClick={onClose}
          style={{ width: 30, height: 30, border: '1.5px solid rgba(26,26,26,0.25)', background: 'transparent', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 2 }}>
          <X/>
        </button>
      </div>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 12 }}>
        <p style={{ fontFamily: 'var(--font-display)', fontSize: 14, color: 'var(--muted)', fontStyle: 'italic' }}>Settings coming soon.</p>
        <p style={{ fontFamily: 'var(--font-body)', fontSize: 8, color: 'var(--muted)', letterSpacing: 4, textTransform: 'uppercase', opacity: 0.4 }}>— ✦ —</p>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   APP
══════════════════════════════════════════ */
function App() {
  const [jarOpen, setJarOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [currentPage, setCurrentPage] = useState(0);
  const containerRef = useRef(null);
  const pageRefs = useRef([]);

  useEffect(() => {
    const container = containerRef.current;
    if (!container) return;
    const observer = new IntersectionObserver(
      entries => entries.forEach(entry => {
        if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
          const idx = pageRefs.current.indexOf(entry.target);
          if (idx !== -1) setCurrentPage(idx);
        }
      }),
      { root: container, threshold: 0.5 }
    );
    pageRefs.current.forEach(el => { if (el) observer.observe(el); });
    return () => observer.disconnect();
  }, []);

  const navigateTo = useCallback(i => {
    const el = pageRefs.current[i];
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  }, []);

  const setRef = i => el => { pageRefs.current[i] = el; };
  const pages = [StreamPage, PlannerPage, KitchenPage, GymPage, TrackerPage, PicksPage];

  return (
    <div className="phone-frame">
      <MarbleJar open={jarOpen} onClose={() => setJarOpen(false)} onNavigate={navigateTo} currentPage={currentPage}/>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)}/>
      <Header onJarOpen={() => setJarOpen(true)} onSettingsOpen={() => setSettingsOpen(true)}/>
      <div className="swipe-container" ref={containerRef}>
        <PageDots currentPage={currentPage} totalPages={pages.length} onDotClick={navigateTo}/>
        {pages.map((Page, i) => (
          <div key={i} ref={setRef(i)} className="swipe-page-wrap">
            <Page/>
          </div>
        ))}
      </div>
      <ChatBar/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <DataProvider><App/></DataProvider>
);
</script>
</body>
</html>
